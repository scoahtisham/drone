<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
  background: #f5f5f5;
}

button {
  width: 90%;
  max-width: 300px;
  padding: 15px;
  font-size: 16px;
  margin: 10px;
  border-radius: 10px;
  border: none;
}

.mapBtn { background: #34a853; color: white; }
.continueBtn { background: #0b57d0; color: white; }
</style>
</head>

<body>

<h3>📍 Getting your location...</h3>

<div id="actions" style="display:none;">
  <button class="mapBtn" onclick="openMap()">🗺️ View Location</button>
  <button class="continueBtn" onclick="goForm()">✅ Continue</button>
</div>

<script>
let lat, lng;

navigator.geolocation.getCurrentPosition(function(position) {
  lat = position.coords.latitude;
  lng = position.coords.longitude;

  document.querySelector("h3").innerHTML = "📍 Location Captured";
  document.getElementById("actions").style.display = "block";
});

function openMap() {
  window.open("https://www.google.com/maps?q=" + lat + "," + lng, "_blank");
}

function goForm() {
  window.location.href =
    "https://docs.google.com/forms/d/e/1FAIpQLSfQjU6XeuV_Koy3UMIX-vIHw7njQtu5O1II3I1ttFBg-J9JIg/viewform"
    + "?entry.858939236=" + lat
    + "&entry.522193154=" + lng;
}
</script>

</body>
</html>
